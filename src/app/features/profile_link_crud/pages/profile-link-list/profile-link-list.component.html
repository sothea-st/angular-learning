<section class="dark:bg-gray-900 p-5 sm:p-5">
     <div class="mx-auto w-5/6 px-4 lg:px-12">

     
          <!-- Main modal -->
          <div *ngIf="isDialog" class="fixed inset-0 z-10 flex items-center justify-center bg-gray-500/75">
               <!-- Modal content -->
               <div class="bg-white dark:bg-gray-700 rounded-lg shadow-sm w-full max-w-[500px] mx-4">
               <!-- Modal header -->
                    <div class="flex items-center justify-between md:p-3 border-b rounded-t dark:border-gray-600 border-gray-200">
                         <!-- <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Terms of Service</h3> -->
                         <button
                              (click)="onCloseModal()"
                              type="button"
                              class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
                              data-modal-hide="default-modal"
                         >
                              <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                                   <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                              </svg>
                              <span class="sr-only">Close modal</span>
                         </button>
                    </div>

                    <!-- Modal body -->
                    <div class="p-4 md:p-5 space-y-4">
                         <p class="text-base text-center leading-relaxed text-gray-900">
                              Are you sure to delete this item ?
                         </p>
                    </div>

                    <!-- Modal footer -->
                    <div class="flex justify-end p-4 md:p-3 border-t border-gray-200 rounded-b dark:border-gray-600">
                         <button
                              (click)="onCloseModal()"
                              data-modal-hide="default-modal"
                              type="button"
                              class="justify-center rounded-md bg-red-600 px-3 py-2 text-sm text-white shadow-xs hover:bg-red-500 sm:ml-3 sm:w-auto"
                         >
                              Cancel
                         </button>
                         <button
                              (click)="_delete()"
                              data-modal-hide="default-modal"
                              type="button"
                              class="ml-3 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
                         >
                              Yes
                         </button>
                    </div>
               </div>
          </div>


          <div class="flex justify-between">
               <app-button-back (back)="onBack()"></app-button-back>
               <app-button-add-new (addNew)="addNew()"></app-button-add-new>
          </div>

          <app-datatable 
               *ngIf="profileLinkModel" 
               [columns]="columns" 
               [data]="profileLinkModel.data"
               [isLoading]="isLoading" 
               [totalLength]="profileLinkModel.count" 
               [pageSize]="profileLinkService.pageSize"
               (onPage)="onRead($event)" 
               (onSelectPerPage)="onChangePerPage($event)"
               (onSearchValue)="onSearch($event)"
          >
               <ng-template #rowTemplate let-item let-i="index">
                    <td class="text-center text-gray-900 whitespace-nowrap"> {{ (currentPage - 1) * pageSize + i + 1 }}</td>
                    <td class="px-4 py-3 text-gray-900 ">{{ item.profileLink | truncate }}</td>
                    <td class="py-3 flex space-x-2">
                         <app-edit-icon [id]="item.id" (edit)="onEdit($event)"></app-edit-icon>
                         <app-delete-icon [id]="item.id" (delete)="onDelete($event)"></app-delete-icon>
                    </td>
               </ng-template>
          </app-datatable>
     </div>
</section>
