<label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{label}}</label>
<input
  [type]="type"
  [name]="name"
  [required]="required"
  [placeholder]="placeholder"
  [(ngModel)]="value"
  (blur)="markAsTouched()"
  class="bg-gray-50 border text-gray-900 text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:outline-none"
  [ngClass]="{
    'border-red-500 focus:border-red-500 focus:ring-red-500': required && !value && touched,
    'border-gray-300': !required || (value || !touched)
  }"
/>
